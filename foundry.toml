[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 1000

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 256
depth = 64
