name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      # Fork tests are excluded here so this job never depends on a third-party RPC being
      # reachable or within its rate limit. They run in the `fork` job below.
      - name: Run Forge tests
        run: forge test -vvv --no-match-path 'test/*.fork.t.sol'

  fork:
    name: Fork tests
    runs-on: ubuntu-latest
    # Informational: these depend on a live mainnet RPC, so an outage or rate limit should not
    # redden a PR that did not break anything.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run fork tests
        # Falls back to a public endpoint when the secret is absent, and skips if none is reachable.
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: forge test -vvv --match-path 'test/*.fork.t.sol'
